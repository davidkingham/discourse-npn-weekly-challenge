plugins:
  npn_weekly_challenges_enabled:
    default: false
    client: true

  npn_weekly_challenge_tag_name:
    default: "weekly-challenge"
    type: tag_list
    client: true

  npn_weekly_challenge_category_ids:
    default: ""
    type: list
    list_type: category
    client: false

  npn_weekly_challenge_wordpress_api_url:
    default: ""
    client: false

  npn_weekly_challenge_wordpress_username:
    default: ""
    client: false

  npn_weekly_challenge_wordpress_app_password:
    default: ""
    client: false
    secret: true

  npn_weekly_challenge_registry_json:
    default: "[]"
    textarea: true
    client: false

  npn_weekly_challenge_auto_topic_enabled:
    default: false
    client: false

  npn_weekly_challenge_auto_topic_category:
    default: ""
    type: category
    client: false

  npn_weekly_challenge_auto_topic_author:
    default: "system"
    type: username
    client: false

  npn_weekly_challenge_auto_topic_tags:
    default: ""
    type: tag_list
    client: false

  npn_weekly_challenge_auto_topic_title:
    default: "Weekly Challenge: %{title}"
    client: false

  npn_weekly_challenge_auto_topic_body:
    default: |
      %{date_range}

      %{description}

      [Post to this week's challenge](/submit?type=weekly_challenge)

      [See this week's entries](%{challenge_url})
    textarea: true
    client: false

  npn_weekly_challenge_page_size:
    default: 30
    type: integer
    client: false
    min: 5
    max: 100
