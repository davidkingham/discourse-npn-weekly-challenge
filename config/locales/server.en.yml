en:
  npn_weekly_challenge:
    announcements_feed:
      title: "Weekly challenge announcements"
      description: "The weekly challenge announcement topics, newest first."
  site_settings:
    npn_weekly_challenges_enabled: "Enable the Weekly Challenge archive pages at /weekly-challenges."
    npn_weekly_challenge_tag_name: "Tags that identify Weekly Challenge submission topics. Topics with any of these tags match."
    npn_weekly_challenge_category_ids: "Only include topics from these categories. Leave blank to search all categories."
    npn_weekly_challenge_wordpress_api_url: "WordPress REST endpoint for the Weekly Challenge post type (e.g. https://example.com/wp-json/wp/v2/weekly-challenge). When set, a daily job adds newly published challenges to the archive. Leave blank to disable the sync and rely only on the shipped seed and the manual registry below."
    npn_weekly_challenge_wordpress_username: "WordPress username the sync authenticates as. Set this together with the application password below to also pull scheduled (not yet published) challenges, which the WordPress REST API hides from anonymous requests. Leave blank to sync published challenges only."
    npn_weekly_challenge_wordpress_app_password: "WordPress application password for the username above (Users → Profile → Application Passwords in WordPress). Only ever sent over HTTPS. The account needs no more than the ability to edit posts."
    npn_weekly_challenge_registry_json: "JSON array of manual Weekly Challenge overrides, merged on top of the shipped seed and the WordPress sync (matched by slug). Each entry supports wordpress_challenge_id, title, slug, starts_at, ends_at, and url. See the plugin README for the full format."
    npn_weekly_challenge_auto_topic_enabled: "Automatically create and pin the weekly challenge topic when a challenge starts. The topic is generated from the challenge's title, dates and description, so nothing needs to be staged by hand. Only ever publishes the challenge that has just started — it never backfills past ones — so turning this on mid-week does nothing until the next challenge begins."
    npn_weekly_challenge_auto_topic_category: "Category the weekly challenge topic is created in. Required for auto-publishing."
    npn_weekly_challenge_auto_topic_author: "User the weekly challenge topic is posted as. Falls back to the system user if the username doesn't exist."
    npn_weekly_challenge_auto_topic_tags: "Tags applied to the auto-created weekly challenge topic. Optional."
    npn_weekly_challenge_auto_topic_title: "Title template for the auto-created topic. Placeholders: %%{title}, %%{date_range}, %%{slug}. If a topic with the same title already exists (challenge titles do repeat over the years), the date range is appended to keep it unique."
    npn_weekly_challenge_auto_topic_body: "Body template for the auto-created topic. Placeholders: %%{title}, %%{description}, %%{date_range}, %%{challenge_url} (the challenge's page on this forum), %%{prompt_url} (the WordPress prompt, may be blank), %%{slug}."
    npn_weekly_challenge_page_size: "Number of entries shown per page on a challenge's archive page."
